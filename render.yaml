services:
  - type: worker
    name: pokemon-telegram-alerts
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    # Give the watcher room to finish its current check and close the browser.
    maxShutdownDelaySeconds: 40
    envVars:
      # Both secrets are entered in the Render dashboard, never committed here.
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Measured on 25 Sep 2026: three rounds 30s apart took the block rate from
      # 11% to 84%. A long interval is what keeps the listings readable.
      - key: POLL_INTERVAL_SECONDS
        value: "900"
      - key: POLL_JITTER_SECONDS
        value: "60"
      # A challenged page now fails as soon as the interstitial paints, so the
      # timeout only has to cover a genuinely slow listing.
      - key: NAVIGATION_TIMEOUT_MS
        value: "15000"
      - key: CHECK_CONCURRENCY
        value: "2"
